<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12142e">
  <title>Who Done It?</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Who Done It?">
  <!-- When any file below changes, change the ?v= tag on all four so browsers fetch the new copies. -->
  <link rel="stylesheet" href="styles.css?v=2026-11-14f">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <!-- ============ SETUP SCREEN ============ -->
  <main id="setup" class="screen active">
    <div class="setup-scroll">
      <header class="hero">
        <div class="logo" aria-hidden="true">
          <span class="logo-card lc1">?</span>
          <span class="logo-card lc2">&#128269;</span>
        </div>
        <h1>Who Done It?</h1>
        <p>Read the clue. Guess who did it, or pass the clue to your friend. Guess wrong and you lose your turn.</p>
      </header>

      <section class="panel" aria-labelledby="h-players">
        <div class="panel-head"><h2 id="h-players">Players</h2></div>
        <div class="levels two" id="player-count" role="radiogroup" aria-label="Number of players"></div>
        <div class="names">
          <label class="name-field">
            <span class="name-dot dot-a" aria-hidden="true"></span>
            <input id="name-a" type="text" maxlength="14" placeholder="Player 1" autocomplete="off">
          </label>
          <label class="name-field" id="name-b-field">
            <span class="name-dot dot-b" aria-hidden="true"></span>
            <input id="name-b" type="text" maxlength="14" placeholder="Player 2" autocomplete="off">
          </label>
        </div>
        <p class="hint">Names are optional.</p>
      </section>

      <section class="panel" aria-labelledby="h-level">
        <div class="panel-head"><h2 id="h-level">Difficulty</h2></div>
        <div class="levels" id="levels" role="radiogroup" aria-label="Difficulty"></div>
      </section>

      <section class="panel" aria-labelledby="h-theme">
        <div class="panel-head"><h2 id="h-theme">Mystery</h2></div>
        <div class="themes" id="themes" role="radiogroup" aria-label="Mystery"></div>
      </section>

      <section class="panel" aria-labelledby="h-auto">
        <div class="panel-head"><h2 id="h-auto">Auto-flip</h2></div>
        <label class="switch-row">
          <span class="switch-text">
            <strong>Flip down cards that can't be right</strong>
            <span class="hint" id="auto-hint"></span>
          </span>
          <input id="auto-toggle" class="switch" type="checkbox" role="switch">
        </label>
      </section>
    </div>

    <footer class="setup-footer">
      <div class="summary" id="summary"></div>
      <button class="btn primary big" id="start-btn" type="button">Start game</button>
    </footer>
  </main>

  <!-- ============ GAME SCREEN ============ -->
  <main id="game" class="screen">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">?</span><span class="brand-name">Who Done It?</span></div>
      <div class="progress" aria-live="polite">
        <div class="progress-text"><span id="progress-label">Clue 1 of 1</span><span id="level-label"></span></div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <div class="controls">
        <button class="icon-btn" id="sound-btn" type="button" aria-label="Sound on" title="Sound">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M17 9l5 6M22 9l-5 6"/></svg>
        </button>
        <button class="icon-btn" id="full-btn" type="button" aria-label="Full screen" title="Full screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button class="btn ghost small" id="new-btn" type="button">New game</button>
        <button class="btn ghost small" id="settings-btn" type="button">Settings</button>
      </div>
    </header>

    <div class="game-body">
      <div class="question" id="question"></div>

      <section class="clue-card" aria-live="polite">
        <div class="turn-pill" id="turn-pill"><span class="name-dot" id="turn-dot"></span><span id="turn-text"></span></div>
        <p class="clue-text" id="clue-text"></p>
      </section>

      <div class="board" id="board" role="list"></div>

      <div class="action-bar">
        <label class="switch-row compact">
          <span class="switch-text"><strong>Auto-flip</strong></span>
          <input id="auto-toggle-game" class="switch" type="checkbox" role="switch">
        </label>
        <div class="action-buttons">
          <button class="btn pass big" id="pass-btn" type="button">Pass</button>
          <button class="btn primary big guess" id="guess-btn" type="button" disabled>Guess</button>
        </div>
        <p class="hint" id="guess-hint">Tap a suspect to pick them. Tap the little badge to flip them down.</p>
      </div>
    </div>
  </main>

  <!-- ============ MODAL ============ -->
  <div class="modal-layer" id="modal-layer" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="mystery.js?v=2026-11-14f"></script>
  <script src="art.js?v=2026-11-14f"></script>
  <script src="game.js?v=2026-11-14f"></script>
</body>
</html>
